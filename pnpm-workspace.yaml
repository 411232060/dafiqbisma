import { useState } from "react";
import { useNavigate, Link } from "react-router-dom";
import { Hospital, Eye, EyeOff, AlertCircle } from "lucide-react";
import { useAuth } from "../hooks/useAppData";
import { toast } from "sonner";

export default function Login() {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [showPass, setShowPass] = useState(false);
  const [remember, setRemember] = useState(false);
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);
  const { login } = useAuth();
  const navigate = useNavigate();

  const handleSubmit = async (e: React.FormEvent) => {
    e.preventDefault();
    setError("");
    setLoading(true);
    await new Promise((r) => setTimeout(r, 600));
    const ok = login(email, password);
    setLoading(false);
    if (ok) {
      toast.success("Login berhasil. Selamat datang!");
      navigate("/dashboard");
    } else {
      setError("Email atau kata sandi tidak sesuai.");
    }
  };

  return (
    <div className="min-h-screen flex font-[Inter]">
      <div className="hidden lg:flex w-1/2 bg-gradient-to-br from-[#0f2040] via-[#1e3a8a] to-[#1d4ed8] flex-col items-center justify-center p-16 relative overflow-hidden">
        <div className="absolute top-10 right-10 w-64 h-64 bg-blue-400/10 rounded-full blur-3xl" />
        <div className="absolute bottom-10 left-10 w-96 h-96 bg-indigo-500/10 rounded-full blur-3xl" />
        <div className="relative z-10 text-center">
          <div className="w-20 h-20 bg-white/15 rounded-3xl flex items-center justify-center mx-auto mb-8 border border-white/20">
            <Hospital size={40} className="text-white" />
          </div>
          <h1 className="text-4xl font-bold text-white mb-3">Medika Hospital</h1>
          <p className="text-blue-200 text-lg mb-10">Management System</p>
          <img
            src="https://images.unsplash.com/photo-1538108149393-fbbd81895907?w=500&h=320&fit=crop&auto=format"
            alt="Hospital"
            className="rounded-3xl shadow-2xl opacity-80 w-full max-w-sm mx-auto"
          />
          <p className="text-blue-200 mt-8 text-sm leading-relaxed max-w-xs mx-auto">
            Sistem informasi manajemen rumah sakit yang terintegrasi untuk pelayanan kesehatan terbaik.
          </p>
        </div>
      </div>

      <div className="flex-1 flex items-center justify-center p-8 bg-gray-50">
        <div className="w-full max-w-md">
          <div className="lg:hidden flex items-center gap-2.5 mb-8 justify-center">
            <div className="w-10 h-10 bg-blue-700 rounded-xl flex items-center justify-center">
              <Hospital size={20} className="text-white" />
            </div>
            <p className="font-bold text-blue-900 text-lg">Medika Hospital</p>
          </div>

          <div className="bg-white rounded-3xl shadow-sm border border-gray-100 p-8">
            <div className="mb-8">
              <h2 className="text-2xl font-bold text-gray-900 mb-1">Masuk ke Sistem</h2>
              <p className="text-gray-500 text-sm">Gunakan akun petugas Anda untuk masuk</p>
            </div>

            {error && (
              <div className="mb-6 flex items-center gap-2.5 bg-red-50 border border-red-200 text-red-700 rounded-xl px-4 py-3 text-sm">
                <AlertCircle size={16} className="flex-shrink-0" />
                {error}
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-5">
              <div>
                <label className="block text-sm font-semibold text-gray-700 mb-1.5">Email</label>
                <input
                  type="email"
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  placeholder="nama@medikahospital.com"
                  required
                  className="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all bg-gray-50 focus:bg-white"
                />
              </div>

              <div>
                <label className="block text-sm font-semibold text-gray-700 mb-1.5">Kata Sandi</label>
                <div className="relative">
                  <input
                    type={showPass ? "text" : "password"}
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    placeholder="••••••••"
                    required
                    className="w-full border border-gray-200 rounded-xl px-4 py-3 pr-12 text-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all bg-gray-50 focus:bg-white"
                  />
                  <button type="button" onClick={() => setShowPass(!showPass)} className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors p-1">
                    {showPass ? <EyeOff size={16} /> : <Eye size={16} />}
                  </button>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <input
                  type="checkbox"
                  id="remember"
                  checked={remember}
                  onChange={(e) => setRemember(e.target.checked)}
                  className="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500"
                />
                <label htmlFor="remember" className="text-sm text-gray-600">Ingat saya</label>
              </div>

              <button
                type="submit"
                disabled={loading}
                className="w-full bg-blue-700 hover:bg-blue-800 disabled:bg-blue-400 text-white font-semibold py-3.5 rounded-xl transition-colors flex items-center justify-center gap-2"
              >
                {loading ? (
                  <>
                    <div className="w-4 h-4 border-2 border-white/40 border-t-white rounded-full animate-spin" />
                    Memproses...
                  </>
                ) : "Masuk"}
              </button>
            </form>

            <div className="mt-6 p-4 bg-blue-50 rounded-xl border border-blue-100">
              <p className="text-xs text-blue-700 font-semibold mb-1">Akun Demo</p>
              <p className="text-xs text-blue-600">Email: admin@medikahospital.com</p>
              <p className="text-xs text-blue-600">Password: admin123</p>
            </div>
          </div>

          <p className="text-center mt-6 text-sm text-gray-500">
            <Link to="/" className="text-blue-600 hover:underline font-medium">← Kembali ke Beranda</Link>
          </p>
        </div>
      </div>
    </div>
  );
}
